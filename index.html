<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors</title>
</head>

<body>
    <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Rock Paper Scissors</h1>

        <div class="choices">
            <div id="paper" class="choice"><img src="./images/paper.jpg" /></div>
            <div id="rock" class="choice"><img src="./images/rock.jpg" /></div>
            <div id="scissors" class="choice"><img src="./images/scissors.jpg" /></div>
        </div>

        <div class="score-board">

            <div class="score">
                <p id="user-score">0</p>
                <p>YOU</p>
            </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>Computer</p>
            </div>
        </div>
        <div class="msg-container">
            <p id="msg">Play Your Move</p>
        </div>
        <script src="script.js"></script>

        

    </body>

</html>
